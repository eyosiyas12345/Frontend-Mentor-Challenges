<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      body {
        background-color: rgb(213, 225, 239);
        text-align: center;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family:Arial;
      }
      .qr-container{
        width: 300px;
        height: 500px;
        background-color: white;
        border-radius: 24px;
        padding: 16px;
      }
      .image-container{
        margin-top: 0px;
      }
      .image-container{
        width:300px;
        height:300px;
      }
      .qr-image {
        border-radius: 12px;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .text-container{
        padding:16px;
      }
      .title {
        margin-top: 24px;
        font-size: 20px;
        font-weight: bold;
        color: rgb(23, 27, 48);
      }
      .description {
        margin-top: 16px;
        color: gray;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="qr-container">

      <div class="image-container">
        <img class="qr-image" src="images/image-qr-code.png" alt="" />
      </div>

      <div class="text-container">
        <p class="title">Improve your front-end skills by building projects</p>
        <p class="description">
          Scan the QR code to visit Fronted Mentor and take your coding skills
          to the next level
        </p>
      </div>

    </div>
  </body>
</html>
